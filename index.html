<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Lab · 6 cấu trúc dữ liệu chạy thật</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero{max-width:760px;margin:10px 0 26px;}
  .hero h1{font-size:28px;} .hero p{font-size:14.5px;color:var(--muted);line-height:1.6;}
  .scard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s;}
  .scard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,50,.08);}
  .scard .top{display:flex;align-items:center;gap:9px;}
  .scard .icon{font-size:22px;}
  .scard .num{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .scard h3{margin:0;font-size:16px;color:var(--ink);}
  .scard .hook{font-size:13px;color:var(--muted);line-height:1.5;min-height:38px;}
  .scard .go{font-size:12.5px;font-weight:800;color:var(--green);}
  .scard .done-badge{margin-left:auto;font-size:12px;font-weight:800;color:var(--green);}
</style>
</head>
<body>
  <div class="hero">
    <h1>🧪 Code Lab — cấu trúc dữ liệu <span style="color:var(--green)">chạy thật</span></h1>
    <p>Mỗi trạm là 1 trang tương tác — code JS <b>chạy thật</b>, không phải slide chết. Xem cây mọc, xem con trỏ quay vòng, xem va chạm xảy ra trước mắt bạn, rồi trả lời 1 câu hỏi để "tốt nghiệp" trạm đó.</p>
  </div>
  <div class="grid" id="grid"></div>

<script src="common.js"></script>
<script>
(function(){
  const HOOKS = {
    circular: "Băng chuyền sushi: đầy hay rỗng, biết sao được?",
    stack:    "Ngăn xếp lời gọi hàm — vào sau, ra trước.",
    hash:     "Khách sạn đánh số phòng: biết số là tới thẳng.",
    avl:      "Cây tìm kiếm tự xoay, không bao giờ nghiêng thành đường thẳng.",
    segment:  "Đếm tiền lẻ bằng cách gộp cụm, không cộng từng tờ.",
    quadtree: "1 triệu điểm, 60 khung hình/giây — cắt cả nhánh khỏi quét."
  };
  const grid = document.getElementById('grid');
  CL.STATIONS.forEach((s,i)=>{
    const a = document.createElement('a');
    a.className = 'card scard';
    a.href = s.href;
    const done = CL.isDone(s.key);
    a.innerHTML =
      '<div class="top"><span class="icon">'+s.icon+'</span><span class="num">Trạm '+(i+1)+'</span>'+(done?'<span class="done-badge">✅ Xong</span>':'')+'</div>'+
      '<h3>'+s.label+'</h3>'+
      '<div class="hook">'+HOOKS[s.key]+'</div>'+
      '<div class="go">Bắt đầu →</div>';
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
